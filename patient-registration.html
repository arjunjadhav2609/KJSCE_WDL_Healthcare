<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Registration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <h1>Online Registration</h1>
    <hr>

    <form>
        <fieldset>
            <legend>Personal Details</legend>
        
            <label for = "name">Patient Name:</label>
            <input type = "text" id = "name" name = "name" placeholder="Enter your Full name" required autofocus><br><br>

            <label for = "age">Age:</label>
            <input type = "number" id = "age" name = "age" placeholder="Enter your Age" required><br><br>

            <label>Gender:</label>
            <label><input type="radio" name = "Gender" value = "Male" required>Male</label>
            <label><input type="radio" name = "Gender" value = "Female" required>Female</label>

        </fieldset>
        <fieldset>

            <legend>Patient's Contact</legend>

            <label for = "mono">Mobile Number:</label>
            <input type = "tel" id = "mono" name = "mobilenumber" pattern="[0-9]{10}" required><br><br>

            <label for = "email">Email:</label>
            <input type = "email" id = "email" name = "email" placeholder="arjunpathlabs@gmail.com" required>

        </fieldset>

        <fieldset>

            <legend>Test & Appointment Details</legend>

            <label for="dob">DOB:</label>
            <input type="date" id="dob" name="dob"><br><br>

            <label>Test Selection:</label>
            <label><input type="checkbox" name="testsel" value="CBC"> CBC</label>
            <label><input type="checkbox" name="testsel" value="HbA1c"> HbA1c</label>
            <label><input type="checkbox" name="testsel" value="LFT"> LFT</label>
            <label><input type="checkbox" name="testsel" value="KFT"> KFT</label>
            <label><input type="checkbox" name="testsel" value="ECG"> ECG</label><br><br>

            <label for="pad">Preferred Appointment Date:</label>
            <input type="date" id="pad" name="pad">

        </fieldset>

        <fieldset>

            <legend>Sample & Prescription</legend>
        
            <label>Sample Collection Preference:</label>
            <label><input type="radio" name="scp" value="Hc" required> Home Collection</label>
            <label><input type="radio" name="scp" value="Vl" required> Visit Lab</label><br><br>
        
            <label for="udp">Upload Doctor Prescription:</label>
            <input type="file" id="udp" name="udp">

        </fieldset>

        <br><br>
        <button type="submit">Register</button>


    </form>

    <br><br><br>
    <nav>
        <a href="index.html">Home</a>
    </nav>
</body>
</html>
