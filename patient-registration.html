<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Registration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form.css">
    <style>
        input.invalid,
        select.invalid,
        textarea.invalid {
            border: 2px solid #c62828;
            background-color: #fff5f5;
        }
    </style>

</head>
<body>
    <h1>Online Registration</h1>
    <hr>

    <form novalidate>
        <fieldset>
            <legend>Personal Details</legend>

            <label for = "name">Patient Name:</label>
            <input type = "text" id = "name" name = "name" placeholder="Enter your Full name" autofocus>
            <span id = "nameError" style="color:red;"></span><br><br>

            <label for = "age">Age:</label>
            <input type = "number" id = "age" name = "age" placeholder="Enter your Age" required><br><br>

            <label>Gender:</label>
            <label><input type="radio" id="genderMale" name="Gender" value="Male">Male</label>
            <label><input type="radio" id="genderFemale" name="Gender" value="Female">Female</label>
            <span id = "genderError" style="color:red;"></span><br><br>

            <label for = "address">Address:</label>
            <input type = "text" id = "address" name = "address" placeholder="Enter your Address">
            <span id = "addressError" style="color:red;"></span><br><br>

        </fieldset>
        <fieldset>

            <legend>Patient's Contact</legend>

            <label for = "mono">Mobile Number:</label>
            <input type = "tel" id = "mono" name = "mobilenumber">
            <span id = "monoError" style="color:red;"></span><br><br>

            <label for = "email">Email:</label>
            <input type = "text" id = "email" name = "email" placeholder="arjunpathlabs@gmail.com">
            <span id = "emailError" style="color:red;"></span>

        </fieldset>

        <fieldset>

            <legend>Test & Appointment Details</legend>

            <label for="dob">DOB:</label>
            <input type="date" id="dob" name="dob">
            <span id = "dobError" style="color:red;"></span><br><br>

            <label for="bloodgroup">Blood Group:</label>
            <select id="bloodgroup" name="bloodgroup">
                <option value="">Select</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
            <span id = "bloodgroupError" style="color:red;"></span><br><br>

            <label for="regdate">Registration Date:</label>
            <input type="date" id="regdate" name="regdate">
            <span id = "regdateError" style="color:red;"></span><br><br>

            <label for="dept">Department:</label>
            <select id="dept" name="dept">
                <option value="">Select</option>
                <option value="General">General Physician</option>
                <option value="Pathology">Pathology</option>
                <option value="Cardiology">Cardiology</option>
            </select>
            <span id = "deptError" style="color:red;"></span><br><br>

            <label>Test Selection:</label>
            <label><input type="checkbox" id="testCBC" name="testsel" value="CBC"> CBC</label>
            <label><input type="checkbox" id="testHbA1c" name="testsel" value="HbA1c"> HbA1c</label>
            <label><input type="checkbox" id="testLFT" name="testsel" value="LFT"> LFT</label>
            <label><input type="checkbox" id="testKFT" name="testsel" value="KFT"> KFT</label>
            <label><input type="checkbox" id="testECG" name="testsel" value="ECG"> ECG</label><br><br>

            <label for="pad">Preferred Appointment Date:</label>
            <input type="date" id="pad" name="pad"><br><br>

        </fieldset>

        <fieldset>

            <legend>Sample & Prescription</legend>

            <label>Sample Collection Preference:</label>
            <label><input type="radio" id="scpHome" name="scp" value="Hc" required> Home Collection</label>
            <label><input type="radio" id="scpLab" name="scp" value="Vl" required> Visit Lab</label><br><br>    

            <label for="udp">Upload Doctor Prescription:</label>
            <input type="file" id="udp" name="udp">

        </fieldset>

        <br><br>
        <button type="submit">Register</button>
        <button type="reset">Reset</button>

    </form>

    <br><br><br>
    <nav>
        <a href="index.html">Home</a>
    </nav>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(document).ready(function () {

        $("form").on("submit", function (e) {

        e.preventDefault();

        var isValid = true;

        var name = $("#name").val().trim();
        var namePattern = /^[A-Za-z ]+$/;

        if (name === "") {
            $("#nameError").text("Name cannot be empty");
            $("#name").addClass("invalid");
            isValid = false;
        } else if (!namePattern.test(name)) {
            $("#nameError").text("Name should contain only letters and spaces");
            $("#name").addClass("invalid");
            isValid = false;
        } else {
            $("#nameError").text("");
            $("#name").removeClass("invalid");
        }

        var address = $("#address").val().trim();

        if (address === "") {
            $("#addressError").text("Address cannot be empty");
            $("#address").addClass("invalid");
            isValid = false;
        } else {
            $("#addressError").text("");
            $("#address").removeClass("invalid");
        }

                var mono = $("#mono").val().trim();
        var monoPattern = /^[6-9][0-9]{9}$/;

        if (mono === "") {
            $("#monoError").text("Mobile number cannot be empty");
            $("#mono").addClass("invalid");
            isValid = false;
        } else if (!monoPattern.test(mono)) {
            $("#monoError").text("Enter a valid 10-digit Indian mobile number (starts with 6-9)");
            $("#mono").addClass("invalid");
            isValid = false;
        } else {
            $("#monoError").text("");
            $("#mono").removeClass("invalid");
        }

        var email = $("#email").val().trim();
        var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (email === "") {
            $("#emailError").text("Email cannot be empty");
            $("#email").addClass("invalid");
            isValid = false;
        } else if (!emailPattern.test(email)) {
            $("#emailError").text("Enter a valid email address");
            $("#email").addClass("invalid");
            isValid = false;
        } else {
            $("#emailError").text("");
            $("#email").removeClass("invalid");
        }

                if ($("input[name='Gender']:checked").length === 0) {
            $("#genderError").text("Please select a gender");
            isValid = false;
        } else {
            $("#genderError").text("");
        }

        if ($("#bloodgroup").val() === "") {
            $("#bloodgroupError").text("Please select a blood group");
            $("#bloodgroup").addClass("invalid");
            isValid = false;
        } else {
            $("#bloodgroupError").text("");
            $("#bloodgroup").removeClass("invalid");
        }

        if ($("#dept").val() === "") {
            $("#deptError").text("Please select a department");
            $("#dept").addClass("invalid");
            isValid = false;
        } else {
            $("#deptError").text("");
            $("#dept").removeClass("invalid");
        }

        var today = new Date();
        today.setHours(0, 0, 0, 0);

        var dob = $("#dob").val();

        if (dob === "") {
            $("#dobError").text("Date of birth cannot be empty");
            $("#dob").addClass("invalid");
            isValid = false;
        } else if (new Date(dob + "T00:00:00") > today) {
            $("#dobError").text("Date of birth cannot be in the future");
            $("#dob").addClass("invalid");
            isValid = false;
        } else {
            $("#dobError").text("");
            $("#dob").removeClass("invalid");
        }

        var regdate = $("#regdate").val();

        if (regdate === "") {
            $("#regdateError").text("Registration date cannot be empty");
            $("#regdate").addClass("invalid");
            isValid = false;
        } else if (new Date(regdate + "T00:00:00") > today) {
            $("#regdateError").text("Registration date cannot be in the future");
            $("#regdate").addClass("invalid");
            isValid = false;
        } else {
            $("#regdateError").text("");
            $("#regdate").removeClass("invalid");
        }

        if (isValid) {
            alert("Registration successful");
        }

    });

});
</script>

</body>
</html>
